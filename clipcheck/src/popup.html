<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        margin: 0;
        padding: 16px;
        color: #18181b;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 img {
        width: 20px;
        height: 20px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        font-size: 13px;
      }
      .muted {
        color: #71717a;
        font-size: 12px;
        line-height: 1.5;
      }
      button,
      a.btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        background: #4338ca;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        margin-top: 10px;
      }
      button.secondary {
        background: #fff;
        color: #3f3f46;
        border: 1px solid #d4d4d8;
        font-weight: 500;
      }
      /* Toggle */
      .switch {
        position: relative;
        width: 36px;
        height: 20px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #d4d4d8;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.15s;
      }
      input:checked + .slider {
        background: #4338ca;
      }
      input:checked + .slider::before {
        transform: translateX(16px);
      }
    </style>
  </head>
  <body>
    <h1><img src="../icons/icon32.png" alt="" /> ClipCheck</h1>
    <div class="row">
      <span>Attachment alerts</span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>
    <p class="muted">
      Warns you before Gmail sends an email that mentions an attachment but
      doesn't have one.
    </p>
    <div id="pro-area"></div>
    <button class="secondary" id="options">Settings & keywords</button>
    <script src="config.js"></script>
    <script src="ExtPay.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
